[package]
name = "kexpand"
version = "0.2.6"
edition = "2021"
license = "MIT"
description = "Expand SUSE kernel-source.git patches into a Linux kernel git repository"

[profile.release]
lto = true
opt-level = 3

[dependencies]
libpatch = { package = "rapidquilt", path = "rapidquilt" }
git2 = "=0.21.0"
rayon = "=1.12.0"
anyhow = "=1.0.103"
openssl = "0.10"
clap = { version = "=4.6.1", features = ["derive", "env"] }
chrono = "=0.4.45"
memchr = "=2.8.2"

[profile.profiling]
inherits = "release"
debug = true
