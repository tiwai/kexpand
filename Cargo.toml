[package]
name = "kexpand"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Expand SUSE kernel-source.git patches into a Linux kernel git repository"

[profile.release]
lto = true
opt-level = 3

[dependencies]
libpatch = { package = "rapidquilt", path = "/home/tiwai/git/misc/rapidquilt" }
git2 = "=0.21.0"
rayon = "=1.12.0"
anyhow = "=1.0.103"
clap = { version = "=4.6.1", features = ["derive"] }
chrono = "=0.4.45"
memchr = "=2.8.2"
